<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DADA - Web Player</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <div class="container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="nav-section">
        <div class="logo">
          <i class="fa-brands fa-spotify"></i>
          <span>DADA</span>
        </div>
        <nav class="nav-links">
          <a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a>
          <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
        </nav>
      </div>

      <div class="library-section">
        <div class="library-header">
          <button class="lib-btn"><i class="fa-solid fa-bookmark"></i> Your Library</button>
          <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="library-list">
          <div class="playlist-item">
            <img src="https://picsum.photos/id/10/50/50" alt="Cover" />
            <div class="playlist-info">
              <h4>Liked Songs</h4>
              <p>Playlist • 12 songs</p>
            </div>
          </div>
          <div class="playlist-item">
            <img src="https://picsum.photos/id/20/50/50" alt="Cover" />
            <div class="playlist-info">
              <h4>Chill Lofi Beats</h4>
              <p>Playlist • Spotify</p>
            </div>
          </div>
          <div class="playlist-item">
            <img src="https://picsum.photos/id/30/50/50" alt="Cover" />
            <div class="playlist-info">
              <h4>Top Hits 2026</h4>
              <p>Playlist • Spotify</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="What do you want to play?" />
        </div>
        <div class="user-profile">
          <button class="badge">Explore Premium</button>
          <div class="avatar"><i class="fa-solid fa-user"></i></div>
        </div>
      </header>

      <section class="hero-section">
        <h2>Good evening</h2>
        <div class="cards-grid" id="featured-grid">
        </div>
      </section>

      <section class="section">
        <h3>Made For You</h3>
        <div class="cards-grid" id="songs-grid">
        </div>
      </section>
    </main>
  </div>

  <footer class="player">
    <div class="now-playing">
      <img src="https://picsum.photos/id/1025/60/60" id="current-cover" alt="Album Cover" />
      <div class="track-details">
        <span class="track-title" id="current-title">Select a song</span>
        <span class="track-artist" id="current-artist">--</span>
      </div>
      <button class="like-btn" id="like-btn"><i class="fa-regular fa-heart"></i></button>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
        <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button id="play-btn" class="play-main"><i class="fa-solid fa-play"></i></button>
        <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
        <button id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
      </div>

      <div class="progress-bar-container">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" max="100" />
        <span id="total-duration">0:00</span>
      </div>
    </div>

    <div class="volume-controls">
      <i class="fa-solid fa-volume-high" id="volume-icon"></i>
      <input type="range" id="volume-bar" value="80" min="0" max="100" />
    </div>
  </footer>

  <audio id="audio-player"></audio>
  <script src="js/script.js"></script>
</body>
</html>
